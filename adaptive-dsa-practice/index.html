<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Adaptive coding interview practice with weighted DSA scheduling and progress tracking."><title>Adaptive DSA Practice</title><link rel="stylesheet" href="./css/styles.css"></head>
<body><main class="shell"><header class="hero"><div class="eyebrow">INTERVIEW PREP · ADAPTIVE PRACTICE</div><h1>Adaptive DSA <span>Practice</span></h1><p>Practice smarter. Spend more time on the patterns that need work.</p></header><div id="notice" role="status" aria-live="polite"></div><section class="stats" id="stats" aria-label="Practice statistics"></section><div class="layout"><section class="panel"><div class="section-head"><h2>Practice session</h2><span class="chip">LeetCode linked</span></div><div id="practice"></div></section><section class="panel"><div class="section-head"><h2>Pattern priorities</h2><span class="muted">Higher = more practice</span></div><div id="patterns"></div></section></div><section class="panel history"><div class="section-head"><h2>Recent attempts</h2><button class="secondary small" id="reset">Reset progress</button></div><div id="history"></div></section><footer><span>Progress stays in this browser. Results are self-reported.</span><div class="footer-actions"><button class="secondary small" id="export">Export progress</button><label class="secondary small file-button">Import progress<input type="file" id="import" accept="application/json,.json" hidden></label></div></footer></main><script type="module" src="./js/app.js"></script></body></html>
